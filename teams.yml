# Bootcamp teams and their leads, shared by zedu-fe, zedu-mobile and zedu-desktop.
# - Team routing requests review from the team's leads.
# - Lead approval sets the "Lead approved" status once one of them approves.
# - Reviewer notify reads the keys to know which forks are teams.
# Workflows read this file from zedu-ci's main branch when they run, so a change here applies to every
# repo at once, with no caller bump. A PR can't change its own mapping: it lives outside the PR's repo.
#
# A PR's team is the owner of its head fork (the org an intern forked into), matched to a key below
# case-insensitively: a key must equal the fork org's login (e.g. zedu-flamingo). One org per team,
# used for all three repos. A fork that isn't listed here isn't routed and can't be lead-approved.
# Reviewers are NOT listed here: once a PR is lead-approved and its checks pass, Reviewer notify
# mentions the reviewers team and any reviewer can claim the PR with /claim.
#
# teams:
#   fork-owner-name:            # exactly the fork org's login, e.g. zedu-flamingo
#     leads:                    # one or more; any one can approve, so a single absence isn't a blocker
#       - lead-handle           # plain login, no @
#
# Teams are added as they register.

