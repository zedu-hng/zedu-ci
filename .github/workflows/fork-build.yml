name: Fork build

# Reusable. Trusted: runs in the review repo with its own token and NEVER checks out PR code. It only
# reads the contributor fork's "PR build" run (public API) for the PR's exact head commit and relays
# the result. That run is trustworthy because Protected files rejects PRs that change .github/**, and
# the fork builds with the workflow file from that same commit.
#
# Sets two commit statuses and a sticky comment with the build's artifacts:
# - Fork build: the fork's PR build result for the head commit.
# - Backend dependency: green on our default backend; red while the PR body has a `Backend URL:` line
#   (the PR depends on backend work that isn't on dev yet) or the line is invalid.
# The fork's PR build names its build jobs "<target> · <backend host>", so a build made against a
# different backend than the PR body asks for (the line was added, changed or removed after the
# build) is reported as a failure until the fork rebuilds.
#
# The relay never waits while holding a runner (the org shares 20 slots). It checks once; while the
# fork build is missing or still running, it dispatches itself again with attempt+1, and that run's
# `delay` job uses the fork-build-wait environment, whose 3-minute wait timer holds no runner. It keeps
# re-checking for about an hour while a build runs, and about 30 minutes while there's no build yet (so a
# manual first build is picked up). Statuses and the comment are written only when the result changes.
# Every 15 minutes a sweep also re-checks PRs whose Fork build is still pending, as a backstop.
#
# Caller: .github/workflows/fork-build.yml named "Fork build", with
#   run-name: "Fork build #<PR>" (the sweep reads it), on pull_request_target (opened, synchronize,
#   reopened, ready_for_review, edited), issue_comment (created), workflow_dispatch with inputs `pr`
#   and `attempt`, and schedule. The per-PR concurrency group lives in the caller.
# Caller permissions: actions: write, contents: read, pull-requests: write, statuses: write.
# The caller repo needs the fork-build-wait environment (3-minute wait timer, default branch only).

on:
  workflow_call:
    inputs:
      default_backend:
        description: Backend host builds use when the PR body has no Backend URL line
        type: string
        default: api.hng.groups.zedu.chat
      artifact_help:
        description: Markdown lines under the artifact list, saying how to install each build
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Scheduled: re-dispatch the relay for open PRs whose Fork build is still pending.
  sweep:
    name: Re-check pending PRs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - run: |
          # PRs whose relay is already running or waiting on its delay: leave their chain alone (a
          # dispatch would cancel it through the per-PR concurrency group).
          for st in queued waiting in_progress; do
            gh api --paginate "repos/$REPO/actions/workflows/fork-build.yml/runs?status=$st&per_page=100" \
              --jq '.workflow_runs[].display_title | capture("#(?<n>[0-9]+)$").n'
          done | sort -u > active.txt
          # One GraphQL read gives every open PR's head statuses, instead of a REST status call per PR.
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, not shell
          gh api graphql --paginate -F owner="${REPO%%/*}" -F name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    number baseRefName
                    commits(last: 1) { nodes { commit { status { contexts { context description } } } } }
                  }
                }
              }
            }' |
          jq -rs '
            [.[].data.repository.pullRequests.nodes[]][]
            | select(.baseRefName == "dev" or .baseRefName == "central-staging")
            | ([.commits.nodes[0].commit.status.contexts[]? | select(.context == "Fork build")][0].description // "") as $desc
            | "\(.number) \($desc)"' |
          while read -r number desc; do
            if grep -qxF "$number" active.txt; then echo "PR #$number: relay already active; skipped"; continue; fi
            case "$desc" in
              "No build yet"*|"Fork build running"*)
                echo "PR #$number: re-checking ($desc)"
                # One final check: an attempt above both re-check limits never starts a new chain.
                # Stop at the first failure so a rate-limited sweep doesn't fire a dispatch per PR.
                gh workflow run fork-build.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f pr="$number" -f attempt=100 || {
                  echo "::warning::Dispatch failed (likely API rate limit); stopping the sweep."; break; } ;;
            esac
          done

  # Only for the relay's own re-checks: the environment's wait timer delays this job ~3 minutes
  # without holding a runner, then the relay runs.
  delay:
    name: Wait before re-checking
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.attempt != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: fork-build-wait
    steps:
      - run: echo "Re-check ${ATTEMPT} after the wait timer."
        env:
          ATTEMPT: ${{ github.event.inputs.attempt }}

  relay:
    name: Relay fork build
    needs: delay
    # A body edit only matters when the old or new body mentions a Backend URL (contains() ignores
    # case); template ticks and other edits take no runner.
    if: >-
      always() && needs.delay.result != 'failure' && needs.delay.result != 'cancelled' &&
      ((github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' ||
         (github.event.changes.body != null &&
          (contains(github.event.pull_request.body, 'backend url') ||
           contains(github.event.changes.body.from, 'backend url'))))) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == '/fork-build' || startsWith(github.event.comment.body, '/fork-build '))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
      ATTEMPT: ${{ github.event.inputs.attempt || '0' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DEFAULT_BACKEND: ${{ inputs.default_backend }}
      CONTEXT: Fork build
      BACKEND_CONTEXT: Backend dependency
    steps:
      - name: Resolve PR
        id: pr
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 1; }
          # One GraphQL read instead of four REST calls (PR, repo parent, changed files, body). The
          # installation token is shared across the whole repo, so the per-run request count matters.
          owner=${REPO%/*}; name=${REPO#*/}
          attempt=0
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, not shell
          until data=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                parent { nameWithOwner }
                pullRequest(number: $pr) {
                  headRefOid
                  headRefName
                  body
                  headRepository { nameWithOwner }
                  files(first: 100) { totalCount nodes { path } }
                  labels(first: 100) { nodes { name } }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR_NUMBER"); do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::warning::Could not resolve PR #$PR_NUMBER after $attempt attempts (API error); leaving the status unchanged."
              exit 0
            fi
            sleep $((attempt * 10))
          done
          # A missing PR resolves to pullRequest: null with a successful exit; don't run on sha=null.
          if [ "$(jq -r '.data.repository.pullRequest // empty | .headRefOid' <<< "$data")" = "" ]; then
            echo "::warning::PR #$PR_NUMBER not found; leaving the status unchanged."
            exit 0
          fi
          # Same-repo PRs (reviewer branches, bots) and upstream long-lived branches have no fork build.
          # Only contributor forks get the relay.
          jq -r --arg repo "$REPO" '
            .data.repository as $r
            | $r.pullRequest as $p
            | ($p.files.nodes // [] | map(.path)) as $files
            | ($p.files.totalCount // 0) as $fileCount
            | ($p.labels.nodes // [] | map(.name)) as $labels
            | "sha=\($p.headRefOid)",
              "head_repo=\($p.headRepository.nameWithOwner // "")",
              "internal=\(if ($p.headRepository.nameWithOwner // "") == $repo
                            or (($p.headRepository.nameWithOwner // "") == ($r.parent.nameWithOwner // "")
                                and ($p.headRefName == "dev" or $p.headRefName == "central-staging"))
                          then "true" else "false" end)",
              "docs_only=\(if ($fileCount > 0) and ($fileCount <= 100) and ($files | all(endswith(".md")))
                            then "true" else "false" end)",
              "bypass=\(if ($labels | index("sync")) or ($labels | index("hotfix"))
                         then "true" else "false" end)"
          ' <<< "$data" >> "$GITHUB_OUTPUT"

          # The backend this PR's build must use: the Backend URL line of its body, or the default. The
          # fork's build gate (build-gate.yml) runs the same parse; Lint fails if the two drift.
          sha=$(jq -r '.data.repository.pullRequest.headRefOid' <<< "$data")
          body=$(jq -r '.data.repository.pullRequest.body // ""' <<< "$data")
          # shared:backend-url begin
          # The PR body's Backend URL line: backend=<api host>, "" without a line, or "invalid".
          line=$(printf '%s\n' "$body" | tr -d '\r' | grep -iE '^[[:space:]]*backend url:' | head -1 || true)
          backend=""
          if [ -n "$line" ]; then
            url=$(sed -E 's/^[[:space:]]*[Bb][Aa][Cc][Kk][Ee][Nn][Dd] [Uu][Rr][Ll]:[[:space:]]*//; s/[[:space:]`<>]//g; s#/+$##' <<< "$line")
            if [[ "$url" =~ ^https://(api\.[a-z0-9-]+\.groups\.zedu\.chat)$ ]]; then backend=${BASH_REMATCH[1]}; else backend=invalid; fi
          fi
          # shared:backend-url end
          case "$backend" in
            "") backend=$DEFAULT_BACKEND; state=success; desc="Uses the dev backend ($DEFAULT_BACKEND)" ;;
            invalid) state=failure; desc="Backend URL must look like https://api.<name>.groups.zedu.chat" ;;
            *) state=failure; desc="Depends on backend $backend. Merge after it's on dev, then delete the Backend URL line." ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          last=$(gh api "repos/$REPO/commits/$sha/status" | jq -r --arg c "$BACKEND_CONTEXT" \
            '[.statuses[] | select(.context == $c)][0] // empty | "\(.state)|\(.description)"' || true)
          if [ "$last" != "$state|${desc:0:140}" ]; then
            gh api "repos/$REPO/statuses/$sha" -f state="$state" -f context="$BACKEND_CONTEXT" -f description="${desc:0:140}" >/dev/null \
              || echo "::warning::Couldn't post the $BACKEND_CONTEXT status."
          fi

      - name: No fork build needed
        id: none_needed
        if: steps.pr.outputs.internal == 'true' || steps.pr.outputs.docs_only == 'true' || steps.pr.outputs.bypass == 'true'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          INTERNAL: ${{ steps.pr.outputs.internal }}
          BYPASS: ${{ steps.pr.outputs.bypass }}
        run: |
          if [ "$BYPASS" = "true" ]; then
            reason="Sync/hotfix PR; no fork build needed"
          elif [ "$INTERNAL" = true ]; then
            reason="Same-repo or sync PR; no fork build needed"
          else
            reason="Docs-only change; no build needed"
          fi
          last=$(gh api "repos/$REPO/commits/$SHA/status" | jq -r --arg c "$CONTEXT" \
            '[.statuses[] | select(.context == $c)][0] // empty | "\(.state)|\(.description)"' || true)
          [ "$last" = "success|$reason" ] && exit 0
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context="$CONTEXT" -f description="$reason" >/dev/null
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check the fork's PR build
        id: run
        if: steps.pr.outputs.internal == 'false' && steps.pr.outputs.docs_only == 'false' && steps.pr.outputs.bypass != 'true'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          BACKEND: ${{ steps.pr.outputs.backend }}
        run: |
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid attempt: $ATTEMPT"; exit 1; }
          # Write only on change: each write is an API call, and GitHub caps statuses per commit and context.
          last=$(gh api "repos/$REPO/commits/$SHA/status" | jq -r --arg c "$CONTEXT" \
            '[.statuses[] | select(.context == $c)][0] // empty | "\(.state)|\(.description)"' || true)
          status() {
            [ "$1|$2" = "$last" ] && return 0
            gh api "repos/$REPO/statuses/$SHA" -f state="$1" -f context="$CONTEXT" -f description="$2" ${3:+-f target_url="$3"} >/dev/null
            echo "changed=true" >> "$GITHUB_OUTPUT"
          }
          again() { echo "again=true" >> "$GITHUB_OUTPUT"; }
          no_build() {
            echo "found=false" >> "$GITHUB_OUTPUT"
            status pending "No build yet for ${SHA:0:7}. In your fork: Actions > PR build > Run workflow." "${1:-}"
            # Keep looking for a manual first build for ~30 minutes (10 delayed re-checks).
            [ "$ATTEMPT" -lt 10 ] && again
            return 0
          }
          run=$(gh api "repos/$HEAD_REPO/actions/workflows/pr-build.yml/runs?head_sha=$SHA&per_page=10" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/pr-build.yml")] | sort_by(.created_at) | last // empty' 2>/dev/null || true)
          if [ -z "$run" ]; then
            # A push's fork run takes a moment to register, so the first check stays quiet.
            if [ "$ATTEMPT" -eq 0 ]; then again; exit 0; fi
            no_build
            exit 0
          fi
          url=$(jq -r .html_url <<< "$run")
          if [ "$(jq -r .status <<< "$run")" != "completed" ]; then
            status pending "Fork build running for ${SHA:0:7}" "$url"
            # ~1 hour of 3-minute re-checks; then the sweep or a /fork-build comment takes over.
            if [ "$ATTEMPT" -lt 20 ]; then again; else echo "Still running after $ATTEMPT re-checks; comment /fork-build to re-check."; fi
            exit 0
          fi
          conclusion=$(jq -r .conclusion <<< "$run")
          run_id=$(jq -r .id <<< "$run")
          jobs=$(gh api "repos/$HEAD_REPO/actions/runs/$run_id/jobs?per_page=100")
          # Build jobs are every job but the gate. The caller prefixes job names ("PR build / ..."),
          # so match the end. A run whose build jobs were all skipped (pushed before the PR existed)
          # is not a build.
          built=$(jq '[.jobs[] | select((.name | endswith("Open PR check")) | not) | select(.conclusion != "skipped")] | length' <<< "$jobs")
          if [ "$built" -eq 0 ] && [ "$conclusion" = "success" ]; then no_build "$url"; exit 0; fi
          # The backend each build job used, from its name ("<target> · <host>").
          built_backend=$(jq -r '[.jobs[] | select(.conclusion != "skipped") | .name | capture(" · (?<h>[a-z0-9.-]+)$").h] | unique | join(",")' <<< "$jobs")
          {
            echo "found=true"
            echo "url=$url"
            echo "id=$run_id"
            echo "conclusion=$conclusion"
            echo "built_backend=$built_backend"
          } >> "$GITHUB_OUTPUT"
          if [ "$conclusion" != "success" ]; then
            status failure "Fork build $conclusion for ${SHA:0:7}" "$url"
          elif [ "$BACKEND" = invalid ]; then
            status failure "Fix the Backend URL line, then rebuild in your fork" "$url"
          elif [ -z "$built_backend" ]; then
            status failure "Built by an old PR build without a backend. Merge dev into your branch and push" "$url"
          elif [ "$built_backend" != "$BACKEND" ]; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
            status failure "Built against $built_backend, PR asks for $BACKEND. Re-run PR build in your fork" "$url"
            # Watch for the rebuild for ~30 minutes, as for a missing first build.
            if [ "$ATTEMPT" -lt 10 ]; then again; fi
          else
            status success "Fork build passed for ${SHA:0:7} ($BACKEND)" "$url"
          fi

      - name: Compose comment
        # Only on a verdict that changed (a "running" update has no comment to write).
        if: steps.run.outputs.changed == 'true' && steps.run.outputs.found != ''
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          FOUND: ${{ steps.run.outputs.found }}
          URL: ${{ steps.run.outputs.url }}
          RUN_ID: ${{ steps.run.outputs.id }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          BACKEND: ${{ steps.pr.outputs.backend }}
          BUILT_BACKEND: ${{ steps.run.outputs.built_backend }}
          MISMATCH: ${{ steps.run.outputs.mismatch }}
          ARTIFACT_HELP: ${{ inputs.artifact_help }}
        run: |
          {
            echo "### Fork build for \`${SHA:0:7}\`"
            echo
            if [ "$FOUND" != "true" ]; then
              echo "No build found yet in \`$HEAD_REPO\`. Builds only run once this PR is open, so trigger the first one:"
              echo "**your fork → Actions → PR build → Run workflow** on this branch, or push a commit. This check looks for it every few minutes for the next half hour; after that, or to check now, comment \`/fork-build\`."
              echo
              echo "Still nothing? Check that Actions is enabled in your fork and that it's synced with \`$REPO\`."
            elif [ "$CONCLUSION" != "success" ]; then
              echo "The fork build **$CONCLUSION**: [see the run]($URL). Fix it and push; this updates automatically. Re-ran it in your fork instead? Comment \`/fork-build\`."
            elif [ "$BACKEND" = invalid ]; then
              echo "The \`Backend URL:\` line in the PR description isn't valid. Use \`Backend URL: https://api.<team>.groups.zedu.chat\`, or delete the line to use the dev backend, then re-run **PR build** in your fork."
            elif [ -z "$BUILT_BACKEND" ]; then
              echo "This build ran an old copy of PR build that doesn't record its backend. Merge \`dev\` into your branch and push."
            elif [ "$MISMATCH" = "true" ]; then
              echo "This build talks to \`$BUILT_BACKEND\`, but the PR description asks for \`$BACKEND\`. Re-run **PR build** in your fork (Actions → PR build → Run workflow). This check picks the new build up within half an hour; after that, comment \`/fork-build\`."
            else
              echo "Built in your fork against \`$BACKEND\`: [run]($URL). Download from its **Artifacts** section:"
              echo
              # Artifact names come from the fork: keep only safe characters.
              # shellcheck disable=SC2016 # literal backticks for Markdown
              gh api "repos/$HEAD_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' \
                | tr -cd 'A-Za-z0-9._\n-' | sed 's/^/- `/; s/$/`/'
              if [ -n "$ARTIFACT_HELP" ]; then
                echo
                printf '%s\n' "$ARTIFACT_HELP"
              fi
            fi
          } > comment.md

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.run.outputs.changed == 'true' && steps.run.outputs.found != ''
        with:
          header: fork-build
          number: ${{ env.PR_NUMBER }}
          path: comment.md

      # The ready-for-review queue needs this PR's Fork build result, and a status write fires no event.
      # Its 3-minute re-checks don't trigger it (Reviewer notify ignores dispatched Fork build runs), so
      # tell it here, only when the result changed. Runs share one group there, so bursts collapse.
      - name: Update review queue
        if: >-
          (steps.run.outputs.changed == 'true' && steps.run.outputs.found == 'true') ||
          (steps.pr.outputs.docs_only == 'true' && steps.none_needed.outputs.changed == 'true')
        run: gh workflow run reviewer-notify.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" || echo "::warning::Couldn't dispatch Reviewer notify; its sweep catches up."

      # Last step: the next run joins this PR's concurrency group, which cancels this one.
      - name: Re-check later
        if: steps.run.outputs.again == 'true'
        run: |
          gh workflow run fork-build.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f pr="$PR_NUMBER" -f attempt="$((ATTEMPT + 1))"
          echo "Re-check $((ATTEMPT + 1)) scheduled in ~3 minutes."
