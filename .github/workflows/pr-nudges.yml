name: PR nudges

# Reusable. Periodically reminds the author and the team lead(s) about a PR's unresolved review
# threads and its merge conflicts. The caller schedules it every 2h; each PR's nudge comment is edited
# in place and refreshed only once per THROTTLE_HOURS, so a PR is nudged at most once per window no
# matter how often the sweep runs, and the rate budget is spent once per window.
#
# One GraphQL read of every open PR (open_prs_with_review_state) covers mergeability and review
# threads; a per-PR comment read and write happens only for a PR that needs a nudge.
#
# Caller: schedule (e.g. every 2h) and workflow_dispatch. The caller adds IS_BOOTCAMP.
# Caller permissions: contents: read, pull-requests: write, issues: write.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  CI_REPO: zedu-hng/zedu-ci
  THROTTLE_HOURS: "4"

jobs:
  nudge:
    name: Nudge unresolved comments and conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # zedu-ci's scripts at this workflow's own commit, so they're pinned with it.
      - name: Check out zedu-ci scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .zedu-ci
          sparse-checkout: scripts
          persist-credentials: false

      - name: Load registered teams
        run: |
          # shellcheck source=/dev/null
          source .zedu-ci/scripts/lib/teams.sh
          team_orgs > teams.txt

      - name: Nudge
        run: |
          set -o pipefail
          # shellcheck disable=SC2016 # jq programs use $name variables inside single quotes
          # shellcheck source=/dev/null
          source .zedu-ci/scripts/lib/open-prs.sh
          open_prs_with_review_state > prs.json \
            || { echo "::error::Couldn't list open PRs (API error)."; exit 1; }
          now=$(date +%s)

          # Edit the PR's existing nudge comment, or post one; refresh only after THROTTLE_HOURS since
          # it last changed. One comment per PR combines every reason, so a PR with both unresolved
          # threads and a conflict gets one nudge and one set of mentions per window.
          nudge() { # pr message
            local pr=$1 message=$2
            local marker="<!-- zedu-nudge -->" existing id updated age body
            # shellcheck disable=SC2016 # $m is a jq variable
            existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" \
              | jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | "\(.id) \(.updated_at)"' \
              | tail -1)
            if [ -n "$existing" ]; then
              id=${existing%% *}; updated=${existing#* }
              age=$(( now - $(date -d "$updated" +%s) ))
              if [ "$age" -lt $(( THROTTLE_HOURS * 3600 )) ]; then
                echo "PR #$pr: nudge is fresh (${age}s < $(( THROTTLE_HOURS * 3600 ))s)"
                return 0
              fi
            fi
            body="$message
            $marker"
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
              echo "PR #$pr: refreshed the nudge"
            else
              gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
              echo "PR #$pr: posted the nudge"
            fi
          }

          # One row per open contributor PR that needs a nudge: number, fork owner, author,
          # mergeability, unresolved-thread count.
          # shellcheck disable=SC2016 # $labels and $unresolved are jq variables
          jq -r --arg repo "$REPO" '
            map(select((.baseRefName == "dev" or .baseRefName == "central-staging")
                and .headRepository.nameWithOwner != $repo))
            | .[]
            | select(.isDraft == false)
            | ([.labels.nodes[].name] | join(",")) as $labels
            | select(($labels | split(",") | index("sync")) == null and ($labels | split(",") | index("hotfix")) == null)
            | ([.reviewThreads.nodes[]? | select(.isResolved == false)] | length) as $unresolved
            | select($unresolved > 0 or .mergeable == "CONFLICTING")
            | [.number, (.headRepositoryOwner.login // ""), (.author.login // ""),
               (.mergeable // "UNKNOWN"), ($unresolved | tostring)]
            | join("|")' prs.json > nudges.txt
          echo "$(grep -c . nudges.txt || true) PR(s) to consider"

          declare -A leads_cache
          while IFS='|' read -r num owner author mergeable unresolved; do
            [ -n "$num" ] || continue
            if [ -z "${leads_cache[$owner]:-}" ]; then
              if [ -n "$owner" ] && grep -qixF "$owner" teams.txt; then
                leads_cache[$owner]=$(team_of "$owner" | sed -n 's/^leads=//p' | tr ',' ' ' || true)
              else
                leads_cache[$owner]=" "
              fi
            fi
            handles=${leads_cache[$owner]}
            mentions="@$author"
            # shellcheck disable=SC2086 # one @mention per lead
            for handle in $handles; do [ "$handle" = "$author" ] || mentions="$mentions @$handle"; done
            reasons=""
            if [ "$unresolved" -gt 0 ]; then
              reasons="$unresolved unresolved review thread(s)"
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              [ -n "$reasons" ] && reasons="$reasons and "
              reasons="${reasons}merge conflicts with the base"
            fi
            [ -n "$reasons" ] || continue
            nudge "$num" "This PR has $reasons. $mentions — please resolve before this merges."
          done < nudges.txt
