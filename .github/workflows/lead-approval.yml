name: Lead approval

# Reusable. Sets the "Lead approved" commit status: green once one of the PR author's team leads has
# an approving review, red otherwise. Reads zedu-ci's teams.yml, so a PR can't change it.
#
# A review on a fork PR runs with a read-only token and cannot set a status, so the caller's
# lead-approval-relay.yml re-dispatches this right after a review, and a scheduled sweep re-dispatches
# it for PRs that aren't green yet (both trusted, write-capable paths).
#
# Caller: .github/workflows/lead-approval.yml (that exact name: the sweep and relay dispatch it), on
# pull_request_target (opened, synchronize, reopened, ready_for_review), workflow_dispatch with
# inputs `pr` and `base_ref`, and schedule.
# Caller permissions: actions: write, contents: read, pull-requests: read, statuses: write.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  CI_REPO: zedu-hng/zedu-ci
  CONTEXT: Lead approved

jobs:
  # Scheduled: re-dispatch the check for open contributor PRs whose status isn't green yet.
  sweep:
    name: Re-check pending PRs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - run: |
          # Re-check only contributor PRs whose status isn't green: each dispatch is a runner job on
          # the org's shared 20, and a green PR can only turn red through a review (submitted, edited
          # or dismissed), which lead-approval-relay.yml re-checks straight away, or a push, which
          # runs this workflow anyway. One GraphQL read covers every PR and its status.
          set -o pipefail
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, not shell
          prs=$(gh api graphql --paginate -F owner="${REPO%%/*}" -F name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    number baseRefName
                    headRepository { nameWithOwner }
                    commits(last: 1) { nodes { commit { status { contexts { context state } } } } }
                  }
                }
              }
            }' | jq -rs --arg repo "$REPO" --arg ctx "$CONTEXT" '
              [.[].data.repository.pullRequests.nodes[]][]
              | select(.baseRefName == "dev" or .baseRefName == "central-staging")
              | select(.headRepository.nameWithOwner != $repo)
              | select(([.commits.nodes[0].commit.status.contexts[]? | select(.context == $ctx) | .state][0] // "") != "SUCCESS")
              | "\(.number) \(.baseRefName)"') \
            || { echo "::warning::Could not list open PRs (API error); skipping this sweep."; exit 0; }
          echo "$(grep -c . <<< "$prs" || true) PRs without a green $CONTEXT"
          while read -r number base_ref; do
            [ -n "$number" ] || continue
            echo "PR #$number: re-checking"
            # Stop on the first failure (usually the installation rate limit) instead of firing
            # the rest of the sweep into the same 403s.
            if ! gh workflow run lead-approval.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f pr="$number" -f base_ref="$base_ref"; then
              echo "::warning::Dispatch failed at PR #$number (likely rate limited); stopping this sweep."
              break
            fi
          done <<< "$prs"

  approval:
    name: Check lead approval
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          pr="$EVENT_PR"
          [ -n "$pr" ] || pr="$INPUT_PR"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "No valid PR number; nothing to check."; exit 0; }
          # One GraphQL read instead of six REST calls. This is the workflow's hot path and the
          # installation token is shared across the whole repo, so the per-run request count matters.
          owner=${REPO%/*}; name=${REPO#*/}
          attempt=0
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables, not shell
          until data=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  headRefOid
                  author { login }
                  headRepository { name owner { login } }
                  labels(first: 100) { nodes { name } }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$pr" \
            --jq '.data.repository.pullRequest | {
              sha: .headRefOid,
              author: (.author.login // ""),
              head_repo: (if .headRepository then (.headRepository.owner.login + "/" + .headRepository.name) else "" end),
              head_owner: (if .headRepository then .headRepository.owner.login else "" end),
              labels: ([.labels.nodes[].name] | join(","))
            }'); do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::warning::Could not resolve PR #$pr after $attempt attempts (API error); leaving the status unchanged."
              exit 0
            fi
            sleep $((attempt * 10))
          done
          {
            echo "number=$pr"
            jq -r '"sha=\(.sha)", "author=\(.author)", "head_repo=\(.head_repo)", "head_owner=\(.head_owner)", "labels=\(.labels)"' <<< "$data"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve leads
        id: leads
        if: steps.pr.outputs.number != ''
        env:
          AUTHOR: ${{ steps.pr.outputs.author }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_OWNER: ${{ steps.pr.outputs.head_owner }}
        run: |
          if [ "$HEAD_REPO" = "$REPO" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$AUTHOR" in
            *\[bot\]|github-actions)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          gh api -H "Accept: application/vnd.github.raw" "repos/$CI_REPO/contents/teams.yml?ref=main" > teams.yml
          ruby -ryaml -e '
            cfg = YAML.load_file("teams.yml") || {}
            owner = ENV.fetch("HEAD_OWNER", "").downcase
            name, team = (cfg["teams"] || {}).find { |k, _| k.to_s.downcase == owner }
            if team
              puts "mapped=true"
              puts "leads=#{Array(team["leads"]).join(",")}"
            else
              puts "mapped=false"
            end
          ' >> "$GITHUB_OUTPUT"

      - name: Set status
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          SKIP: ${{ steps.leads.outputs.skip }}
          MAPPED: ${{ steps.leads.outputs.mapped }}
          LEADS: ${{ steps.leads.outputs.leads }}
          HEAD_OWNER: ${{ steps.pr.outputs.head_owner }}
          LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          setstatus() { gh api "repos/$REPO/statuses/$SHA" -f state="$1" -f context="$CONTEXT" -f description="$2" >/dev/null; }
          case ",$LABELS," in
            *,sync,*|*,hotfix,*)
              setstatus success "Sync/hotfix PR; lead approval not enforced"
              exit 0 ;;
          esac
          if [ "$SKIP" = "true" ]; then
            setstatus success "Same-repo or bot PR; lead approval not enforced"
            exit 0
          fi
          if [ "$MAPPED" != "true" ]; then
            setstatus failure "Fork '$HEAD_OWNER' isn't a registered team; a maintainer must add it to zedu-ci teams.yml"
            exit 0
          fi
          if [ -z "$LEADS" ]; then
            setstatus failure "Team '$HEAD_OWNER' has no leads in zedu-ci teams.yml"
            exit 0
          fi
          # The effective review state per person is their latest non-comment review, across all pages.
          # gh can't combine --slurp with --jq (every run failed), so the pages are piped into jq.
          # pipefail: an API failure must fail the step, not read as "no approvals".
          set -o pipefail
          approved=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews?per_page=100" \
            | jq -r 'flatten | map(select(.state != "COMMENTED" and .state != "PENDING")) | group_by(.user.login | ascii_downcase) | map(.[-1]) | map(select(.state == "APPROVED")) | .[].user.login')
          leads_list=$(printf '%s\n' "$LEADS" | tr ',' '\n' | grep -v '^$')
          # Logins are case-insensitive on GitHub; teams.yml is typed by hand.
          hit=$(printf '%s\n' "$approved" | grep -Fxif <(printf '%s\n' "$leads_list") | head -1 || true)
          # shellcheck disable=SC2086 # one @login per word
          printf 'Leads: %s\nApprovals: %s\n' "$(printf '%s ' $leads_list)" "$(printf '%s ' $approved)"
          if [ -n "$hit" ]; then
            setstatus success "Approved by team lead @$hit"
          else
            # shellcheck disable=SC2086 # one @login per word
            setstatus failure "Waiting for an approving review from a team lead: $(printf '@%s ' $leads_list)"
          fi
