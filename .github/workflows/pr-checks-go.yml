name: PR checks (Go)

# Reusable. Review-org replacement for Zedu's "PR pre-commit checks", "PR Review Bot", "Commitlint",
# the file-policy / audit / gitleaks half of "Security checks" and the heuristics half of "Malware
# scan" in a Go repo (zedu-be). Those workflows are disabled in zedu-hng (their files stay as
# upstream, so syncs don't conflict); semgrep, ClamAV and the obfuscation scan run in pr-scans.yml.
#
# One job: checkout once, run every check (each runs even if an earlier one fails), build once.
# Zedu's scripts and configs (verify-changed-files.sh, scan-malware.mjs, pr-review/) are called
# unchanged, but from the base branch, so a PR can't loosen them for itself.
#
# Untrusted: runs PR code with a read-only token. It only uploads artifacts:
#   pr-checks-results  per-check results; pr-review-comment.yml posts them as commit statuses
#   pr-review-report   the review bot's report, posted as a PR comment by the same workflow
#
# Caller: .github/workflows/pr-checks.yml named "PR checks", on pull_request (opened, synchronize,
# reopened, ready_for_review).
# Caller permissions: contents: read.

on:
  workflow_call:
    inputs:
      tests:
        description: Run `go test ./...` as the Tests check
        type: boolean
        default: false
      audit:
        description: Run `govulncheck ./...` as the Dependency audit check
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the base branch's check scripts
        run: |
          git fetch -q --no-tags origin "$BASE_REF"
          for p in .github/scripts .github/pr-review.config.json .github/malware-scan.config.json .gitleaks.toml; do
            if git cat-file -e "FETCH_HEAD:$p" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$p"
            else
              echo "::warning::$p isn't on $BASE_REF; using the PR's copy."
            fi
          done

      # Checks that read the tree as the PR left it run before install (no vendor tree to scan).
      - name: File policy
        id: file_policy
        continue-on-error: true
        run: bash .github/scripts/verify-changed-files.sh "origin/$BASE_REF" HEAD

      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # The final tree, then every commit in the PR: a secret added and deleted again within the PR
          # is still in its history. Both scans run; either finding fails the check.
          status=0
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --config .gitleaks.toml --redact --no-banner || status=1
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts "$BASE_SHA..$SHA" --config .gitleaks.toml --redact --no-banner || status=1
          exit "$status"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Malware heuristics
        id: heuristics
        continue-on-error: true
        run: node .github/scripts/scan-malware.mjs

      - name: Install dependencies
        id: install
        run: go mod download

      - name: Commit messages
        id: commitlint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx --yes -p @commitlint/cli@19 commitlint --from "$BASE_SHA" --to "$SHA" --verbose

      - name: Dependency audit
        id: audit
        if: inputs.audit && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Only the files the PR touches: a repo with legacy unformatted files would otherwise fail
      # every PR until someone reformats the whole tree.
      - name: Format
        id: format
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.go' | grep -v '^vendor/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files; nothing to format-check."
            exit 0
          fi
          unformatted=$(gofmt -l "${files[@]}")
          if [ -n "$unformatted" ]; then
            echo "::error::These changed files are not gofmt-clean:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        id: vet
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: go vet ./...

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: go build ./...

      - name: Tests
        id: tests
        if: inputs.tests && steps.install.outcome == 'success'
        continue-on-error: true
        run: go test -p 1 ./...

      - name: PR review
        id: review
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node .github/scripts/pr-review/run.mjs \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --config .github/pr-review.config.json \
            --output review-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pr-review-report
          path: |
            review-report.md
            review-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record results
        if: always()
        env:
          TESTS_ENABLED: ${{ inputs.tests }}
          AUDIT_ENABLED: ${{ inputs.audit }}
          FILE_POLICY: ${{ steps.file_policy.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          HEURISTICS: ${{ steps.heuristics.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          COMMITLINT: ${{ steps.commitlint.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          VET: ${{ steps.vet.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          REVIEW: ${{ steps.review.outcome }}
        run: |
          : > results.tsv
          row() { # context outcome
            local state desc
            case "$2" in
              success) state=success; desc="Passed" ;;
              failure) state=failure; desc="Failed; see the PR checks run" ;;
              skipped)
                if [ "$INSTALL" != success ]; then state=failure; desc="Not run: dependency install failed"
                else state=success; desc="Not needed for this event"; fi ;;
              *) state=failure; desc="${2:-not run}" ;;
            esac
            printf '%s\t%s\t%s\n' "$1" "$state" "$desc" >> results.tsv
          }
          row "File policy" "$FILE_POLICY"
          row "Gitleaks" "$GITLEAKS"
          row "Malware heuristics" "$HEURISTICS"
          row "Commit messages" "$COMMITLINT"
          if [ "$AUDIT_ENABLED" = true ]; then row "Dependency audit" "$AUDIT"; fi
          row "Format" "$FORMAT"
          row "Go vet" "$VET"
          row "Build" "$BUILD"
          if [ "$TESTS_ENABLED" = true ]; then row "Tests" "$TESTS"; fi
          row "PR review" "$REVIEW"

      # shared:publish-results begin
      # Last, after every scan, so the scanners never see zedu-ci's files. Same in every checks
      # workflow (Lint fails on drift).
      - name: Check out zedu-ci scripts
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .zedu-ci
          sparse-checkout: scripts
          persist-credentials: false

      # pr-review-comment.yml reads this format.
      - name: Publish results
        if: always()
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .zedu-ci/scripts/publish-results.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pr-checks-results
          path: pr-checks-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if a check failed
        if: always()
        run: |
          [ "${fail:-1}" = 0 ] || { echo "::error::${fail:-Some} check(s) failed; see the summary above."; exit 1; }
      # shared:publish-results end
