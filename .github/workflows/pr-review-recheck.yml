name: PR Review recheck

# Reusable. GitHub does not re-run pull_request workflows when the base branch changes, so a review-rule fix
# merged to dev would leave open PRs showing a stale, often false, "PR review" failure until someone
# pushes. On every push to a protected branch this re-runs the latest failed "PR checks" run for each
# open PR whose only failing check is "PR review" (from the statuses pr-review-comment.yml posts,
# read for every open PR in one GraphQL query).
# PRs failing anything else (lint, types, build) wait for the contributor's push: a re-run would
# rebuild for nothing. The review step fetches the base branch's rules when it runs, so a re-run
# picks up the fix.

# Caller: push to dev and central-staging, and workflow_dispatch. The caller's checks workflow must be
# .github/workflows/pr-checks.yml (the runs are looked up by that name).
# Caller permissions: contents: read, actions: write, pull-requests: read.

on:
  workflow_call:

permissions:
  contents: read
  actions: write
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  recheck:
    name: Re-run stale reviews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # zedu-ci's scripts at this workflow's own commit, so they're pinned with it.
      - name: Check out zedu-ci scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .zedu-ci
          sparse-checkout: scripts
          persist-credentials: false

      - name: Re-run checks that failed only on PR review
        run: |
          set -o pipefail
          # One GraphQL read (about 2 points per 100 PRs) gives every open PR's head statuses; a
          # run lookup follows only for PRs whose sole failing check is PR review.
          # shellcheck source=/dev/null
          source .zedu-ci/scripts/lib/open-prs.sh
          open_prs |
          jq -r '
            ["File policy","Gitleaks","Malware heuristics","Commit messages","Dependency audit","Prettier","ESLint","TypeScript","Jest","PR review","Build","Analyze","Format","Tests","Trivy","Forbidden patterns","Lazarus scanner"] as $checks
            | .[]
            | select(.baseRefName == "dev" or .baseRefName == "central-staging")
            | select([.commits.nodes[0].commit.status.contexts[]?
                      | select((.context as $c | $checks | index($c)) and .state == "FAILURE") | .context] == ["PR review"])
            | "\(.number) \(.headRefOid)"' > candidates.txt
          echo "$(grep -c . candidates.txt || true) open PRs fail only on PR review"
          runs="repos/$REPO/actions/workflows/pr-checks.yml/runs?event=pull_request"
          failed=0
          while read -r number sha; do
            if ! run_id=$(gh api "$runs&head_sha=$sha&status=failure&per_page=1" --jq '.workflow_runs[0].id // empty'); then
              echo "::warning::PR #$number: couldn't look up its PR checks run."; failed=$((failed + 1)); continue
            fi
            [ -n "$run_id" ] || continue
            echo "PR #$number: re-running run $run_id"
            if ! gh run rerun "$run_id" --repo "$REPO" --failed; then
              echo "::warning::PR #$number: couldn't re-run run $run_id."; failed=$((failed + 1))
            fi
          done < candidates.txt
          # Every candidate is tried first; then a failed re-run fails the job so it shows.
          [ "$failed" -eq 0 ] || { echo "::error::$failed re-run(s) failed; see the warnings above."; exit 1; }
