name: Lint

# zedu-ci's own check: actionlint (with shellcheck on every run block) and a YAML parse of the data
# files. CodeRabbit reviews every PR too.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: actionlint
        env:
          VERSION: "1.7.12"
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Data files parse
        run: ruby -ryaml -e 'cfg = YAML.load_file("teams.yml"); raise "teams.yml has no teams" unless cfg["teams"].is_a?(Hash); puts "#{cfg["teams"].size} teams"'
